<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chinese Courtyard · 庭院</title>
<style>
  :root {
    --ink: rgba(18, 20, 24, 0.58);
    --line: rgba(255, 255, 255, 0.14);
    --fg: rgba(245, 243, 238, 0.92);
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0a0d12;
    font-family: ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ---------- loading ---------- */
  #loading { position: fixed; inset: 0; background: #0d1015; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px; z-index: 20;
    transition: opacity .8s ease; }
  #loading.done { opacity: 0; pointer-events: none; }
  .load-title { display: flex; gap: 14px; align-items: baseline; }
  .load-cn { color: #e8e3d5; font-size: 44px; letter-spacing: 8px; font-weight: 300; }
  .load-en { color: rgba(232, 227, 213, 0.55); font-size: 13px; letter-spacing: 4px; text-transform: uppercase; }
  #bar { width: 180px; height: 2px; background: rgba(255,255,255,.12); }
  #barIn { width: 0%; height: 100%; background: #c8a86b; transition: width .2s; }
  #loadErr { display: none; max-width: 460px; text-align: center; color: #e89a8a;
    font-size: 12.5px; line-height: 1.7; letter-spacing: .3px; white-space: pre-line; }
  #loadErr.show { display: block; }

  /* ---------- corner buttons ---------- */
  .btns { position: fixed; top: 14px; right: 14px; display: flex; gap: 8px; z-index: 10; }
  .btn { width: 42px; height: 42px; border-radius: 21px; border: 1.5px solid rgba(242, 205, 96, 0.75);
    background: rgba(30, 26, 12, 0.66); color: #f2cd60; cursor: pointer; display: flex; align-items: center;
    justify-content: center; backdrop-filter: blur(6px); transition: background .2s, opacity .3s;
    padding: 0; box-shadow: 0 1px 6px rgba(0,0,0,0.35); }
  .btn:hover { background: rgba(78, 62, 18, 0.85); }
  .btn svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.9;
    stroke-linecap: round; stroke-linejoin: round; }
  .btn .fillpart { fill: currentColor; stroke: none; }

  /* ---------- hint bar ---------- */
  #hints { position: fixed; left: 14px; bottom: 12px; z-index: 10; color: var(--fg);
    font-size: 13px; letter-spacing: .3px; background: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 8px 12px; backdrop-filter: blur(6px);
    opacity: 1; transition: opacity 1.2s ease; white-space: nowrap; }
  #hints.dim { opacity: .32; }
  #hints:hover { opacity: 1; }
  kbd { display: inline-block; border: 1px solid rgba(242, 205, 96, 0.45); border-radius: 4px;
    padding: 0 5px; margin: 0 1px; font-size: 11.5px; font-family: inherit;
    background: rgba(255,255,255,.06); color: #f2cd60; }
  .sep { opacity: .35; margin: 0 6px; }

  /* ---------- location tag ---------- */
  #loc { position: fixed; left: 14px; top: 14px; z-index: 10; color: var(--fg);
    font-size: 12.5px; letter-spacing: 2.5px; background: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 12px; backdrop-filter: blur(6px); opacity: .85; }
</style>
</head>
<body>
<div id="app"></div>

<div id="loc">庭院 · CHINESE COURTYARD</div>

<div class="btns">
  <button class="btn" id="btnDay" title="Day / Sunset / Night (N)">
    <svg viewBox="0 0 24 24"><circle id="icoSun" cx="12" cy="12" r="4.4" class="fillpart"/><g id="icoRays" stroke="currentColor"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/></g><g id="icoDusk" stroke="currentColor" style="display:none"><path d="M7 14a5 5 0 0 1 10 0"/><path d="M4 16.5h16M12 4.5v2.2M6.6 6.4l1.5 1.5M17.4 6.4l-1.5 1.5"/></g><path id="icoMoon" d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" style="display:none"/></svg>
  </button>
  <button class="btn" id="btnRoof" title="Hide / show roofs (R)">
    <svg viewBox="0 0 24 24"><path d="M3.5 11.5 12 4.5l8.5 7"/><path d="M5.5 10v9.5h13V10"/><path id="icoRoofLine" d="M4 20.5h16"/></svg>
  </button>
</div>

<div id="hints">
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move<span class="sep">·</span>drag orbit<span class="sep">·</span>scroll zoom<span class="sep">·</span><kbd>N</kbd> day/sunset/night<span class="sep">·</span><kbd>R</kbd> roof
</div>

<div id="loading">
  <div class="load-title"><span class="load-cn">庭 院</span><span class="load-en">Chinese Courtyard</span></div>
  <div id="bar"><div id="barIn"></div></div>
  <div id="loadErr"></div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
